<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>连接按钮示例</title>
</head>
<body>
    <button id="connectButton">连接钱包</button>
    <!-- 表单 - "购买咖啡" 或 "注入资金" -->
    <label for="ethAmount">ETH 数量</label>
    <input id="ethAmount" placeholder="0.1" />

    <br>
    <button type="button" id="searchButton">查询余额</button>
    <button type="button" id="withdrawButton">提取资金</button>

</html>
